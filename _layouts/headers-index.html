---
layout: page
---
{% assign meta = site.data[site.metadata] %}

<style>
/* ── Search panel ──────────────────────────────────────────────────────── */
.browse-search-panel {
  background: #f8f9fa;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 1.25rem 1.5rem 1rem;
  margin-bottom: 1.5rem;
}
.browse-search-panel .form-label {
  font-weight: 600;
  font-size: 0.875rem;
  color: #333;
  margin-bottom: 0.25rem;
}
.browse-search-panel .form-control:focus,
.browse-search-panel .form-select:focus {
  border-color: #7fc006;
  box-shadow: 0 0 0 0.2rem rgba(127,192,6,0.2);
}
.year-range { display: flex; align-items: center; gap: 0.5rem; }
.year-range .form-control { width: 90px; }
.year-range span { color: #666; font-size: 0.85rem; white-space: nowrap; }
.btn-search {
  background-color: #7fc006;
  border-color: #659a02;
  color: #000;
  font-weight: 600;
}
.btn-search:hover { background-color: #6aaa00; border-color: #5a9000; color: #000; }
.btn-reset {
  background-color: #fff;
  border-color: #ced4da;
  color: #333;
}

/* ── Table controls ────────────────────────────────────────────────────── */
.table-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.show-entries { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
.show-entries select { width: auto; display: inline-block; }

/* ── Browse table ──────────────────────────────────────────────────────── */
#browseTable {
  border-collapse: collapse;
  width: 100%;
}
#browseTable thead th {
  background: #f1f3f5;
  border-top: 2px solid #dee2e6;
  border-bottom: 2px solid #dee2e6;
  padding: 0.6rem 0.75rem;
  font-size: 0.875rem;
  color: #555;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
#browseTable thead th.sort-asc::after  { content: " ▲"; font-size: 0.7em; }
#browseTable thead th.sort-desc::after { content: " ▼"; font-size: 0.7em; }
#browseTable thead th:last-child { text-align: right; width: 140px; }

#browseTable tbody tr:nth-child(even) { background: #f9f9f9; }
#browseTable tbody tr:hover { background: #f0f7e0; }
#browseTable tbody td { padding: 0.5rem 0.75rem; font-size: 0.9rem; border-bottom: 1px solid #e9ecef; }
#browseTable tbody td a { color: #c0392b; text-decoration: none; }
#browseTable tbody td a:hover { text-decoration: underline; }
#browseTable tbody td:last-child { text-align: right; color: #888; }

/* ── Pagination ────────────────────────────────────────────────────────── */
.browse-pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.75rem;
  flex-wrap: wrap;
  gap: 0.5rem;
  font-size: 0.875rem;
}
.browse-pagination .info { color: #666; }
.page-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.page-btn {
  padding: 0.25rem 0.6rem;
  border: 1px solid #dee2e6;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  font-size: 0.875rem;
  color: #333;
  min-width: 32px;
  text-align: center;
}
.page-btn:hover:not(:disabled) { background: #f0f7e0; border-color: #7fc006; }
.page-btn.active { background: #7fc006; border-color: #659a02; color: #000; font-weight: 700; }
.page-btn:disabled { opacity: 0.4; cursor: default; }
.page-btn.ellipsis { border: none; background: none; cursor: default; }

#loadingIcon { margin: 1.5rem 0; }
</style>

<div class="container py-4">

  <h1 class="mb-4" style="color:#7fc006; font-size:1.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;">
    Explorar por cabecera
  </h1>

  <!-- Search panel -->
  <div class="browse-search-panel">
    <div class="row g-3 align-items-end">

      <div class="col-md-4">
        <label class="form-label">Búsqueda</label>
        <input type="text" class="form-control" id="collFilter"
               placeholder="Buscar en títulos y transcripciones...">
      </div>

      <div class="col-md-3">
        <label class="form-label">Lugar de publicación</label>
        <select class="form-select" id="filterLocation">
          <option value="">Todos los lugares</option>
          {% assign seen_locations = "" | split: "" %}
          {% for item in meta %}
            {% if item.location != "" and item.location != nil %}
              {% assign loc = item.location | strip %}
              {% unless seen_locations contains loc %}
                {% assign seen_locations = seen_locations | push: loc %}
              {% endunless %}
            {% endif %}
          {% endfor %}
          {% assign seen_locations = seen_locations | sort %}
          {% for loc in seen_locations %}
            <option value="{{ loc }}">{{ loc }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Años</label>
        <div class="year-range">
          <input type="text" inputmode="numeric" class="form-control" id="yearFrom" placeholder="Desde">
          <span>—</span>
          <input type="text" inputmode="numeric" class="form-control" id="yearTo" placeholder="Hasta">
        </div>
      </div>

      <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-search flex-fill" onclick="applyFilters()">Buscar</button>
        <button class="btn btn-reset flex-fill" onclick="resetFilters()">✕</button>
      </div>

    </div>
  </div>

  <!-- Loading spinner (shown while transcripts load) -->
  <div id="loadingIcon" class="text-center d-none">
    <div class="spinner-border text-dark" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <div class="text-muted small mt-1">Cargando transcripciones…</div>
  </div>

  <!-- Table controls: show N entries -->
  <div class="table-controls">
    <div class="show-entries">
      Mostrar
      <select class="form-select form-select-sm" id="pageSizeSelect" onchange="changePageSize()">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      entradas
    </div>
    <div class="text-muted small" id="collCount"></div>
  </div>

  <!-- Table -->
  <table id="browseTable">
    <thead>
      <tr>
        <th id="thTitle" onclick="toggleSort('title')" class="sort-asc">Título</th>
        <th id="thCount" onclick="toggleSort('count')">Número de ejemplares</th>
      </tr>
    </thead>
    <tbody id="browseBody"></tbody>
  </table>

  <!-- Pagination -->
  <div class="browse-pagination">
    <div class="info" id="pageInfo"></div>
    <div class="page-btns" id="pageBtns"></div>
  </div>

</div>
