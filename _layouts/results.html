---
layout: page
---
{% assign collections = site.data.collections %}

<style>
.results-header {
  background: #1a1a2e;
  color: #fff;
  padding: 1.5rem 2rem;
  margin: -1.5rem -15px 1.5rem -15px;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.results-header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
.results-header .query-badge {
  background: #7fc006;
  color: #000;
  font-weight: 700;
  padding: 0.25rem 0.75rem;
  border-radius: 4px;
  font-size: 1rem;
}

/* Sidebar */
.facet-sidebar { position: sticky; top: 1rem; }
.facet-section { border-bottom: 1px solid #e9ecef; padding-bottom: 1rem; margin-bottom: 1rem; }
.facet-section:last-child { border-bottom: none; }
.facet-title {
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #495057;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
}
.facet-list { list-style: none; padding: 0; margin: 0; font-size: 0.875rem; }
.facet-list li { display: flex; justify-content: space-between; align-items: center; padding: 0.2rem 0; }
.facet-list li label { cursor: pointer; color: #333; flex: 1; }
.facet-list li label:hover { color: #7fc006; }
.facet-count { background: #e9ecef; border-radius: 10px; padding: 0.1rem 0.5rem; font-size: 0.75rem; color: #666; }
.facet-count.active-count { background: #7fc006; color: #000; font-weight: 700; }

.btn-clear { font-size: 0.8rem; color: #666; text-decoration: none; }
.btn-clear:hover { color: #c00; }

/* Results list */
.result-item {
  border: 1px solid #e9ecef;
  border-radius: 6px;
  padding: 1rem 1.25rem;
  margin-bottom: 0.75rem;
  background: #fff;
  transition: box-shadow 0.15s;
}
.result-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.result-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.35rem; }
.result-title a { color: #1a1a2e; text-decoration: none; }
.result-title a:hover { color: #7fc006; }
.result-snippet { font-size: 0.875rem; color: #444; line-height: 1.6; margin-bottom: 0.5rem; }
.result-snippet mark { background: #fff3cd; color: #000; font-weight: 600; padding: 0 2px; border-radius: 2px; }
.result-meta { font-size: 0.78rem; color: #888; display: flex; gap: 1.25rem; flex-wrap: wrap; }
.result-meta span strong { color: #555; }
.result-loading { font-size: 0.8rem; color: #aaa; font-style: italic; }

/* Sort bar */
.sort-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
.sort-bar .result-count { font-size: 0.9rem; color: #555; }
.sort-bar select { font-size: 0.875rem; padding: 0.25rem 0.5rem; border-radius: 4px; border: 1px solid #ced4da; }

/* Pagination */
.pagination .page-link { color: #1a1a2e; }
.pagination .page-item.active .page-link { background-color: #7fc006; border-color: #659a02; color: #000; }
.pagination .page-link:hover { color: #7fc006; }

/* Search within */
.search-within { margin-bottom: 1rem; }
.search-within .input-group { max-width: 100%; }
.search-within .form-control { font-size: 0.875rem; }

#loadingOverlay { text-align: center; padding: 3rem; color: #888; }
</style>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar facets -->
    <div class="col-md-3">
      <h4>Refinar búsqueda</h4>
      
      <div class="mb-3">
        <label class="fw-bold">Cabecera</label>
        <div id="facet-collection"></div>
      </div>
      
      <div class="mb-3">
        <label class="fw-bold">Ubicación</label>
        <div id="facet-location"></div>
      </div>
      
      <div class="mb-3">
        <label class="fw-bold">Década</label>
        <div id="facet-decade"></div>
      </div>
      
      <div class="mb-3">
        <label class="fw-bold">Idioma</label>
        <div id="facet-language"></div>
      </div>
      
      <button id="clear-filters" class="btn btn-outline-secondary w-100 mt-3">
        Limpiar filtros
      </button>
    </div>
    
    <!-- Results area -->
    <div class="col-md-9">
      <div id="search-summary" class="mb-3"></div>
      
      <!-- Sort controls -->
      <div class="row mb-3 g-2">
        <div class="col-md-6">
          <select id="sort-select" class="form-select">
            <option value="relevance">Relevancia</option>
            <option value="date-desc">Fecha (más reciente)</option>
            <option value="date-asc">Fecha (más antiguo)</option>
            <option value="title">Título</option>
          </select>
        </div>
      </div>
      
      <div id="results-list"></div>
      
      <nav id="pagination" aria-label="Paginación de resultados"></nav>
    </div>
  </div>
</div>

<script>
// ============================================================================
// CONFIGURATION
// ============================================================================
const RESULTS_PER_PAGE = 10;
const KWIC_CONTEXT = 50; // characters before/after match

// ============================================================================
// STATE
// ============================================================================
let searchIndex = [];
let searchResults = [];
let currentPage = 1;
let currentSort = 'relevance';
let activeFilters = {
  collection: new Set(),
  location: new Set(),
  decade: new Set(),
  language: new Set()
};

// ============================================================================
// TEXT RECONSTRUCTION (handles hyphenated line breaks)
// ============================================================================
function reconstructRegionText(textLines) {
  if (!textLines || textLines.length === 0) return "";
  
  return textLines.reduce((acc, line, i) => {
    if (i === 0) return line.text || "";
    const prev = acc;
    const curr = line.text || "";
    
    // If previous line ends with hyphen, join directly
    if (prev.endsWith("-")) {
      return prev.slice(0, -1) + curr;
    }
    
    // Otherwise add space
    return prev + " " + curr;
  }, "");
}

// ============================================================================
// FETCH AND INDEX
// ============================================================================
async function loadSearchIndex() {
  const response = await fetch('{{ "/assets/data/search-index.json" | relative_url }}');
  searchIndex = await response.json();
}

async function fetchItemTranscript(objectLocation) {
  try {
    const response = await fetch('{{ site.baseurl }}/' + objectLocation);
    const manifest = await response.json();
    
    // Build searchable structure: { page, regionId, text }
    const searchable = [];
    
    manifest.pages.forEach(page => {
      if (!page.textRegions) return;
      
      page.textRegions.forEach(region => {
        const text = reconstructRegionText(region.textLines);
        if (text.trim()) {
          searchable.push({
            page: page.page,
            regionId: region.id,
            text: text
          });
        }
      });
    });
    
    return searchable;
  } catch (err) {
    console.error('Error fetching transcript:', err);
    return [];
  }
}

// ============================================================================
// SEARCH
// ============================================================================
async function performSearch(query) {
  if (!query || query.trim().length < 2) {
    searchResults = [];
    return;
  }
  
  const terms = query.toLowerCase().trim().split(/\s+/);
  const results = [];
  
  for (const item of searchIndex) {
    // Quick title match
    const titleMatch = terms.every(term => 
      item.title.toLowerCase().includes(term)
    );
    
    if (titleMatch) {
      results.push({
        item: item,
        matches: [{ page: 1, regionId: null, snippet: item.title }],
        relevance: 100
      });
      continue;
    }
    
    // Fetch and search transcript
    const transcript = await fetchItemTranscript(item.object_location);
    const matches = [];
    
    transcript.forEach(entry => {
      const lowerText = entry.text.toLowerCase();
      const allTermsMatch = terms.every(term => lowerText.includes(term));
      
      if (allTermsMatch) {
        // Generate KWIC snippet
        const firstTermPos = lowerText.indexOf(terms[0]);
        const start = Math.max(0, firstTermPos - KWIC_CONTEXT);
        const end = Math.min(entry.text.length, firstTermPos + terms[0].length + KWIC_CONTEXT);
        
        let snippet = entry.text.substring(start, end);
        if (start > 0) snippet = '...' + snippet;
        if (end < entry.text.length) snippet = snippet + '...';
        
        // Highlight terms
        terms.forEach(term => {
          const regex = new RegExp(`(${term})`, 'gi');
          snippet = snippet.replace(regex, '<mark>$1</mark>');
        });
        
        matches.push({
          page: entry.page,
          regionId: entry.regionId,
          snippet: snippet
        });
      }
    });
    
    if (matches.length > 0) {
      results.push({
        item: item,
        matches: matches,
        relevance: matches.length * 10
      });
    }
  }
  
  searchResults = results;
  applySort();
}

// ============================================================================
// FILTERING & SORTING
// ============================================================================
function applyFilters() {
  return searchResults.filter(result => {
    if (activeFilters.collection.size > 0 && 
        !activeFilters.collection.has(result.item.collection)) return false;
    
    if (activeFilters.location.size > 0 && 
        !activeFilters.location.has(result.item.location)) return false;
    
    if (activeFilters.language.size > 0 && 
        !activeFilters.language.has(result.item.language)) return false;
    
    if (activeFilters.decade.size > 0) {
      const year = parseInt(result.item.date.split('-').pop());
      const decade = Math.floor(year / 10) * 10;
      if (!activeFilters.decade.has(decade.toString())) return false;
    }
    
    return true;
  });
}

function applySort() {
  const filtered = applyFilters();
  
  filtered.sort((a, b) => {
    switch (currentSort) {
      case 'relevance':
        return b.relevance - a.relevance;
      case 'date-desc':
        return b.item.date.localeCompare(a.item.date);
      case 'date-asc':
        return a.item.date.localeCompare(b.item.date);
      case 'title':
        return a.item.title.localeCompare(b.item.title);
      default:
        return 0;
    }
  });
  
  renderResults(filtered);
  renderFacets();
}

// ============================================================================
// RENDERING
// ============================================================================
function renderResults(results) {
  const start = (currentPage - 1) * RESULTS_PER_PAGE;
  const end = start + RESULTS_PER_PAGE;
  const page = results.slice(start, end);
  
  const summary = document.getElementById('search-summary');
  summary.innerHTML = `<p class="text-muted small">${results.length} resultado(s) encontrado(s)</p>`;
  
  const list = document.getElementById('results-list');
  
  if (results.length === 0) {
    list.innerHTML = '<p class="text-muted">No se encontraron resultados.</p>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  
  list.innerHTML = page.map(result => {
    const firstMatch = result.matches[0];
    const itemUrl = '{{ "/items/" | relative_url }}' + result.item.id + 
                    `.html?page=${firstMatch.page}&region=${firstMatch.regionId}`;
    
    return `
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">
            <a href="${itemUrl}">${result.item.title}</a>
          </h5>
          <p class="card-text small text-muted">
            ${result.item.collection} | ${result.item.date} | ${result.item.location}
          </p>
          <p class="card-text">${firstMatch.snippet}</p>
          ${result.matches.length > 1 ? 
            `<p class="small text-muted">${result.matches.length} coincidencias en este documento</p>` : ''}
        </div>
      </div>
    `;
  }).join('');
  
  renderPagination(results.length);
}

function renderPagination(totalResults) {
  const totalPages = Math.ceil(totalResults / RESULTS_PER_PAGE);
  const pagination = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  
  let html = '<ul class="pagination">';
  
  // Previous
  html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
    <a class="page-link" href="#" data-page="${currentPage - 1}">Anterior</a>
  </li>`;
  
  // Pages
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
      html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" data-page="${i}">${i}</a>
      </li>`;
    } else if (i === currentPage - 3 || i === currentPage + 3) {
      html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
    }
  }
  
  // Next
  html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
    <a class="page-link" href="#" data-page="${currentPage + 1}">Siguiente</a>
  </li>`;
  
  html += '</ul>';
  pagination.innerHTML = html;
  
  // Event listeners
  pagination.querySelectorAll('a[data-page]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      currentPage = parseInt(e.target.dataset.page);
      applySort();
    });
  });
}

function renderFacets() {
  const filtered = applyFilters();
  
  // Count facets
  const facets = {
    collection: {},
    location: {},
    decade: {},
    language: {}
  };
  
  filtered.forEach(result => {
    const item = result.item;
    
    facets.collection[item.collection] = (facets.collection[item.collection] || 0) + 1;
    facets.location[item.location] = (facets.location[item.location] || 0) + 1;
    facets.language[item.language] = (facets.language[item.language] || 0) + 1;
    
    const year = parseInt(item.date.split('-').pop());
    const decade = Math.floor(year / 10) * 10;
    facets.decade[decade] = (facets.decade[decade] || 0) + 1;
  });
  
  // Render
  renderFacetGroup('collection', facets.collection);
  renderFacetGroup('location', facets.location);
  renderFacetGroup('decade', facets.decade);
  renderFacetGroup('language', facets.language);
}

function renderFacetGroup(type, counts) {
  const container = document.getElementById(`facet-${type}`);
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  
  container.innerHTML = entries.map(([value, count]) => `
    <div class="form-check">
      <input class="form-check-input" type="checkbox" 
             id="facet-${type}-${value}" 
             data-type="${type}" 
             data-value="${value}"
             ${activeFilters[type].has(value) ? 'checked' : ''}>
      <label class="form-check-label small" for="facet-${type}-${value}">
        ${value} (${count})
      </label>
    </div>
  `).join('');
  
  // Event listeners
  container.querySelectorAll('input').forEach(checkbox => {
    checkbox.addEventListener('change', (e) => {
      const type = e.target.dataset.type;
      const value = e.target.dataset.value;
      
      if (e.target.checked) {
        activeFilters[type].add(value);
      } else {
        activeFilters[type].delete(value);
      }
      
      currentPage = 1;
      applySort();
    });
  });
}

// ============================================================================
// INIT
// ============================================================================
async function init() {
  await loadSearchIndex();
  
  // Get query from URL
  const params = new URLSearchParams(window.location.search);
  const query = params.get('q');
  
  if (query) {
    await performSearch(query);
  }
  
  // Sort control
  document.getElementById('sort-select').addEventListener('change', (e) => {
    currentSort = e.target.value;
    currentPage = 1;
    applySort();
  });
  
  // Clear filters
  document.getElementById('clear-filters').addEventListener('click', () => {
    activeFilters = {
      collection: new Set(),
      location: new Set(),
      decade: new Set(),
      language: new Set()
    };
    currentPage = 1;
    applySort();
  });
}

init()
