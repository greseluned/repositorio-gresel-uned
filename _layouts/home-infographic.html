---
layout: page-full-width
---
{% assign meta = site.data[site.metadata] %}
{% assign collections = site.data.headers %}
<style>
/* ── Hero search ─────────────────────────────────────────────────────────── */
.home-hero {
  background: #e9eedf;
  color: #000000;
  padding: 3rem 2rem 2.5rem;
  border-radius: 8px;
}
.home-hero h1 { font-size: 32px; font-weight: 600;}

.search-box {
  background: #fff;
  border-radius: 8px;
  padding: 1.75rem 2rem;
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  max-width: 860px;
}
.search-box .form-label { font-weight: 600; font-size: 0.875rem; color: #333; margin-bottom: 0.3rem; }
.search-box .form-control,
.search-box .form-select {
  border-radius: 4px;
  border: 1px solid #ced4da;
  font-size: 0.95rem;
}
.search-box .form-control:focus,
.search-box .form-select:focus {
  border-color: #7fc006;
  box-shadow: 0 0 0 0.2rem rgba(127,192,6,0.2);
}
.year-range { display: flex; align-items: center; gap: 0.5rem; }
.year-range .form-control { width: 90px; }
.year-range span { color: #666; font-size: 0.85rem; white-space: nowrap; }
.btn-search {
  background-color: #7fc006;
  border-color: #659a02;
  color: #000;
  font-weight: 600;
  padding: 0.5rem 2rem;
  white-space: nowrap;
}
.btn-search:hover { background-color: #6aaa00; border-color: #5a9000; color: #000; }

/* ── Decade chart ────────────────────────────────────────────────────────── */
.decade-chart-wrap {
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 1.5rem 1.75rem 1rem;
  margin-bottom: 2rem;
}
.decade-chart-wrap h2 {
  font-size: 1rem;
  font-weight: 700;
  color: #1a1a2e;
  margin-bottom: 1.25rem;
}
.decade-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 120px;
}
.decade-bar-col {
  display: flex;
  flex-direction: column;
  justify-content: flex-end; /* keeps bars aligned at bottom */
  align-items: center;
  flex: 1;
  height: 100%;
  cursor: pointer;
}
.decade-bar-col:hover .decade-bar { background: #5a9000; }
.decade-bar-col:hover .decade-label { color: #5a9000; }
.decade-bar {
  background: #7fc006;
  border-radius: 3px 3px 0 0;
  width: 95%;
  transition: background 0.15s, height 0.3s;
  min-height: 3px;
}
.decade-count {
  font-size: 0.6rem;
  color: #999;
  margin-bottom: 2px;
}
.decade-label {
  font-size: 0.65rem;
  color: #666;
  margin-top: 4px;
  white-space: nowrap;
  writing-mode: horizontal-tb;
  line-height: 1;
}

</style>

<!-- ── Two-column layout ─────────────────────────────────────────────────── -->
<div class="row g-4">
 
  <!-- Left: search box -->
  <div class="col-lg-9">
    <div class="home-hero">
      <h1>Busca en el repositorio</h1>

    <div class="search-box">
 
      <div class="mb-3">
        <label class="form-label" style="margin-bottom: 1rem">Búsqueda</label>
        <input type="text" class="form-control form-control-lg" id="searchQuery"
               placeholder="Buscar en títulos y transcripciones...">
      </div>
 
      <div class="mb-3">
        <label class="form-label">Cabecera</label>
        <select class="form-select" id="searchCollection">
          <option value="">Todas las cabeceras</option>
          {% for coll in collections %}
          <option value="{{ coll.id }}">{{ coll.title }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Lugar de publicación</label>
        <select class="form-select" id="searchLocation">
          <option value="">Todos los lugares</option>

          {% assign seen_locations = "" | split: "" %}

          {% for item in meta %}
            {% if item.location != "" and item.location != nil %}
              {% assign loc = item.location | strip %}
              {% unless seen_locations contains loc %}
                {% assign seen_locations = seen_locations | push: loc %}
              {% endunless %}
            {% endif %}
          {% endfor %}

          {% assign seen_locations = seen_locations | sort %}

          {% for loc in seen_locations %}
            <option value="{{ loc }}">{{ loc }}</option>
          {% endfor %}

        </select>
      </div>

      <!-- Years -->
      <div class="mb-3">
        <label class="form-label">Años</label>
        <div class="year-range">
          <input type="text" inputmode="numeric" min="1800" max="2000" class="form-control" id="yearFrom" placeholder="Desde">
          <span>—</span>
          <input type="text" inputmode="numeric" min="1800" max="2000" class="form-control" id="yearTo" placeholder="Hasta">
        </div>
      </div>
    </div>
 
      <div class="mt-4">
        <button class="btn btn-search" onclick="doSearch()">Buscar</button>
      </div>
 
    </div>
  </div>
 
  <!-- Right: decade chart + carousel -->
  <div class="col-lg-3">
 
    <!-- Decade distribution chart -->
    <div class="decade-chart-wrap">
      <h2>Distribución por décadas</h2>
      <div class="decade-bars" id="decadeBars"></div>
    </div>
 
    <!-- Carousel -->
    {% include index/carousel.html height=312 %}
 
  </div>
</div>

<script>
// Build decade list safely in Liquid
{% assign decade_list = "" %}

{% for item in meta %}
  {% if item.date != "" and item.date != nil %}
    
    {% assign parts = item.date | split: "-" %}
    {% assign y = nil %}

    {% for p in parts %}
      {% if p.size == 4 %}
        {% assign y = p | plus: 0 %}
      {% endif %}
    {% endfor %}

    {% if y %}
      {% assign dec = y | divided_by: 10 | times: 10 %}
      {% assign decade_list = decade_list | append: dec | append: "," %}
    {% endif %}

  {% endif %}
{% endfor %}

// Raw decade values for each item (compiled by Jekyll)
const itemDecades = [{{ decade_list | remove_last: "," }}];

// Count per decade
const counts = {};
itemDecades.forEach(d => { if (d) counts[d] = (counts[d] || 0) + 1; });

const decades = Object.keys(counts).map(Number).sort((a,b) => a - b);
const maxCount = Math.max(...Object.values(counts));

const barsEl = document.getElementById("decadeBars");

decades.forEach(dec => {
  const count  = counts[dec];
  const pct    = Math.round((count / maxCount) * 100);

  const col  = document.createElement("div");
  col.className = "decade-bar-col";
  col.title  = 
  dec + ":" + count + " número" + (count !== 1 ? "s" : "");
  col.onclick = () => searchByDecade(dec);

  col.innerHTML = `
    <span class="decade-count">${count}</span>
    <div class="decade-bar" style="height:${pct}%"></div>
    <span class="decade-label">${dec}s</span>`;

  barsEl.appendChild(col);
});

// ── Search ────────────────────────────────────────────────────────────────
function doSearch() {
  const query      = document.getElementById("searchQuery").value.trim();
  const collection = document.getElementById("searchCollection").value;
  let yearFrom     = document.getElementById("yearFrom").value;
  let yearTo       = document.getElementById("yearTo").value;

  const MIN = 1800;
  const MAX = 1999;

  // Convert to numbers
  if (yearFrom) yearFrom = parseInt(yearFrom);
  if (yearTo)   yearTo   = parseInt(yearTo);

  // Clamp values to range
  if (yearFrom && yearFrom < MIN) yearFrom = MIN;
  if (yearFrom && yearFrom > MAX) yearFrom = MAX;
  if (yearTo && yearTo < MIN) yearTo = MIN;
  if (yearTo && yearTo > MAX) yearTo = MAX;

  const params = new URLSearchParams();

  if (query)      params.set("q", query);
  if (collection) params.set("collection", collection);
  if (yearFrom)   params.set("from", yearFrom);
  if (yearTo)     params.set("to", yearTo);

  window.location.href = "{{ '/results/' | relative_url }}?" + params.toString();
}

function searchByDecade(dec) {
  const params = new URLSearchParams();
  params.set("from", dec);
  params.set("to",   dec + 9);
  window.location.href = "{{ '/results/' | relative_url }}?" + params.toString();
}

document.getElementById("searchQuery").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

document.getElementById("yearFrom").addEventListener("input", e => {
  if (e.target.value < 1800) e.target.value = 1800;
  if (e.target.value > 2100) e.target.value = 2100;
});

document.getElementById("yearTo").addEventListener("input", e => {
  if (e.target.value < 1800) e.target.value = 1800;
  if (e.target.value > 2100) e.target.value = 2100;
});
</script>
