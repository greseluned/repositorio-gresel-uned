<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Visor de prensa histórica con transcripciones (OpenSeadragon)</title>

<link rel="stylesheet" href="https://viewer.library.wales/viewer-custom.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

<style>
  #osd {
    width: 100%;
    height: 800px;
    border: 1px solid #88ea1230;
    background: #171717
  }

  #osd-controls {
    display: flex;
    align-items: center;
    gap: 0.25em;
    padding: 0.25em;
    background: #1f1f1f;
    border: 1px solid #333;
    border-radius: 6px;
    margin-bottom: 0.4em;
  }

  #osd-controls button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    padding: 0.15em 0.4em;
    font-size: 0.8em;
    line-height: 1;
    border-radius: 4px;
    cursor: pointer;
  }

  #osd-controls button:hover {
    background: #3a3a3a;
  }

  #osd-controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #page-indicator {
    color: #bbb;
    font-size: 0.75em;
    margin-left: auto;
  }

  .text-region {
    border: 0px solid #51803c21;
    background: #51803c21;
    cursor: pointer;
  }

  .text-region:hover {
    border: 0px solid #51803c69;
    background: #51803c69;
  }

  .text-region.active {
    border-color: 0px solid #51803c69;
    background: #51803c69;
  }

  #region-list {
    max-height: calc(800px - 2.5em);
    overflow-y: auto;
    padding: 0.5em;
  }

  .region-wrapper {
    margin-bottom: 0.5em;
  }

  #region-list-wrapper {
    max-height: 800px;
    overflow-y: auto;
    border: 0px;
  }

  .region-button {
    display: block;
    width: 100%;
    padding: 0.4em 0.6em;    
    text-align: left;
    background: #529d2d9c;
    border: 0px solid #529d2d9c;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 500;       
    font-size: 0.75em;      
    line-height: 1.2;
  }

  .region-button:hover {
    background: rgba(210, 220, 190, 0.9);
  }

  .region-button.active {
    background: rgba(210, 220, 190, 0.9);
    outline: 2px solid #529d2d9c;
  }

  .region-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    padding: 0 1em;
    border-left: 3px solid #78af5f91;
    background: rgba(255, 255, 255, 0.05);
    transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s ease;
  }

  .region-content.open {
    max-height: 400px;
    overflow-y: auto;
    opacity: 1;
    padding: 0.5em 1em;
    margin-top: 0.25em;
    text-align: left;
  }

  .region-text {
    white-space: pre-wrap;
    font-size: 0.85em;
    line-height: 1.5;
    color: #ddd;
    margin-bottom: 0.5em;
  }

  .text-line {
    padding: 0.2em 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 0.7em;
  }

  .text-line:last-child {
    border-bottom: none;
  }

  h3 {
    color: #000000;
    margin-top: 1em;
  }
</style>
</head>

<body>

<div style="max-width: 100%; width: 100%; padding: 1rem 1rem;">
  <div style="display: flex; gap: 1em; align-items: flex-start;">

    <!-- Left: viewer column -->
    <div style="flex: 1; min-width: 0;">
      <div id="osd-controls">
        <button id="prev-page">← Anterior</button>
        <button id="next-page">Siguiente →</button>
        <span id="page-indicator">Página 1 / N</span>
      </div>
      <div id="osd"></div>
    </div>

    <!-- Right: transcription column -->
    <div style="width: 400px; flex-shrink: 0; height: 850px;">
      <h3 style="margin-top: 1;">Transcripciones OCR</h3>
      <div id="region-list"></div>
    </div>

  </div>
</div>

<script>
const MANIFEST_URL = '{{ page.object_location | relative_url }}';

let viewer;
let pages = [];
let currentPage = 0;

// ================================
// DEEP LINK PARSING
// ================================
let deepLinkParams = null;

function parseDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const page   = params.get('page');
  const region = params.get('region');

  if (page && region) {
    deepLinkParams = {
      page:     parseInt(page) - 1, // convert to 0-indexed
      regionId: region               // this is region.id from the manifest
    };
  }
}

// ================================
// INIT
// ================================
async function init() {
  parseDeepLink();

  try {
    const response = await fetch(MANIFEST_URL);
    if (!response.ok) throw new Error(`Failed to load manifest: ${response.status}`);

    const manifest = await response.json();
    pages = manifest.pages;

    viewer = OpenSeadragon({
      id: "osd",
      prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
      showNavigator: true,
      showRotationControl: true,
      gestureSettingsMouse: { clickToZoom: false }
    });

    document.getElementById("prev-page").onclick = () => {
      if (currentPage > 0) loadPage(currentPage - 1);
    };
    document.getElementById("next-page").onclick = () => {
      if (currentPage < pages.length - 1) loadPage(currentPage + 1);
    };

    const startPage = deepLinkParams ? deepLinkParams.page : 0;
    loadPage(startPage);

  } catch (error) {
    console.error('Initialization error:', error);
    document.getElementById('region-list').innerHTML =
      `<p style="color: red;">Error loading manifest: ${error.message}</p>`;
  }
}

// ================================
// LOAD PAGE
// ================================
function loadPage(index) {
  currentPage = index;
  const pageData = pages[index];

  const tileSource = {
    type: "image",
    url: '{{ site.baseurl }}/' + pageData.image,
    buildPyramid: true
  };

  viewer.open(tileSource);

  viewer.addOnceHandler('open', () => {
    viewer.clearOverlays();

    // renderRegions returns a map of manifest regionId → viewportRect
    // so we can activate the deep-link region immediately after render
    const regionRectMap = renderRegions(viewer, pageData);
    updatePageIndicator();

    if (deepLinkParams && deepLinkParams.page === index) {
      activateRegion(deepLinkParams.regionId, regionRectMap);
      deepLinkParams = null; // clear after use
    }
  });
}

// ================================
// RENDER REGIONS
// — Uses region.id from manifest as the canonical regionId throughout.
// — Returns { manifestRegionId: viewportRect } for deep-link activation.
// ================================
function renderRegions(viewer, pageData) {
  const container = document.getElementById("region-list");
  container.innerHTML = "";

  const regionRectMap = {};

  if (!pageData.textRegions || pageData.textRegions.length === 0) {
    container.innerHTML = '<p style="color: #999;">No hay regiones de texto en esta página.</p>';
    return regionRectMap;
  }

  const tiledImage = viewer.world.getItemAt(0);
  if (!tiledImage) { console.error('No tiled image loaded'); return regionRectMap; }

  pageData.textRegions.forEach((region, idx) => {
    // Use the manifest's own region.id as the canonical identifier.
    // Fall back to an index-based id only if the manifest has none.
    const regionId = region.id || `REGION-${idx + 1}`;

    // ── Overlay ──
    const overlay = document.createElement("div");
    overlay.className = "text-region";
    overlay.dataset.region = regionId;

    const rect         = calculateBoundingBox(region.points);
    const viewportRect = tiledImage.imageToViewportRectangle(rect.x, rect.y, rect.width, rect.height);

    regionRectMap[regionId] = viewportRect;

    viewer.addOverlay({ element: overlay, location: viewportRect });

    new OpenSeadragon.MouseTracker({
      element: overlay,
      clickHandler: () => {
        zoomToRegion(viewer, viewportRect);
        activateRegion(regionId, regionRectMap);
      }
    });

    // ── Sidebar button + accordion ──
    const wrapper = document.createElement("div");
    wrapper.className = "region-wrapper";

    const btn = document.createElement("button");
    btn.className = "region-button";
    btn.dataset.region = regionId;
    btn.textContent = `Región ${idx + 1}`;

    btn.onclick = () => {
      zoomToRegion(viewer, viewportRect);
      activateRegion(regionId, regionRectMap);
    };

    const content = document.createElement("div");
    content.className = "region-content";
    content.dataset.region = regionId;

    if (region.textLines && region.textLines.length > 0) {
      region.textLines.forEach(line => {
        const lineDiv = document.createElement("div");
        lineDiv.className = "text-line";
        lineDiv.textContent = line.text || "(sin texto)";
        content.appendChild(lineDiv);
      });
    } else {
      content.innerHTML = '<p style="color: #999;">(sin texto)</p>';
    }

    wrapper.appendChild(btn);
    wrapper.appendChild(content);
    container.appendChild(wrapper);
  });

  return regionRectMap;
}

// ================================
// ACTIVATE REGION
// Single entry point that highlights the overlay, opens the accordion,
// scrolls the sidebar button into view, and zooms to the region.
// ================================
function activateRegion(regionId, regionRectMap) {
  // 1. Highlight overlay
  document.querySelectorAll(".text-region").forEach(el => {
    el.classList.toggle("active", el.dataset.region === regionId);
  });

  // 2. Highlight sidebar button
  document.querySelectorAll(".region-button").forEach(el => {
    el.classList.toggle("active", el.dataset.region === regionId);
  });

  // 3. Open accordion (close others)
  document.querySelectorAll(".region-content").forEach(el => {
    if (el.dataset.region === regionId) {
      el.classList.add("open");
    } else {
      el.classList.remove("open");
    }
  });

  // 4. Scroll sidebar button into view
  const activeBtn = document.querySelector(`.region-button[data-region="${regionId}"]`);
  if (activeBtn) {
    const list      = document.getElementById("region-list");
    const btnTop    = activeBtn.offsetTop;
    const btnHeight = activeBtn.offsetHeight;
    const listHeight = list.offsetHeight;
    list.scrollTo({
      top:      btnTop - (listHeight / 2) + (btnHeight / 2),
      behavior: "smooth"
    });
  }

  // 5. Zoom to region if rect is available
  if (regionRectMap && regionRectMap[regionId]) {
    zoomToRegion(viewer, regionRectMap[regionId]);
  }
}

// ================================
// CALCULATE BOUNDING BOX
// ================================
function calculateBoundingBox(points) {
  const xs = points.map(p => p[0]);
  const ys = points.map(p => p[1]);
  return {
    x:      Math.min(...xs),
    y:      Math.min(...ys),
    width:  Math.max(...xs) - Math.min(...xs),
    height: Math.max(...ys) - Math.min(...ys)
  };
}

// ================================
// ZOOM TO REGION
// ================================
function zoomToRegion(viewer, viewportRect) {
  const padding    = 0.1;
  const paddedRect = new OpenSeadragon.Rect(
    viewportRect.x      - padding,
    viewportRect.y      - padding,
    viewportRect.width  + padding * 2,
    viewportRect.height + padding * 2
  );
  viewer.viewport.fitBounds(paddedRect, true);
}

// ================================
// PAGE INDICATOR
// ================================
function updatePageIndicator() {
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage === pages.length - 1;
  document.getElementById("page-indicator").textContent =
    `Página ${currentPage + 1} / ${pages.length}`;
}

// ================================
// START
// ================================
init();
</script>

</body>
</html>
