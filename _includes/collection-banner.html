
{% if page.layout == "home-infographic" and site.data.theme.featured-image %}
<style>
#home-banner {
    background-image: url('{{ site.data.featured_item.src | relative_url }}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
</style>

<div id="home-banner" class="container-fluid p-0">
    <div class="hero-overlay">
        <div class="container py-5">
            <div class="row justify-content-center align-items-center">
                <div class="col-lg-10">
                    <div class="hero-panel">
                        <div class="row align-items-center">
                            <div class="col-lg-7">
                                <h1 class="display-4 mb-3">{{ site.title }}</h1>
                                {% if site.tagline %}
                                <p class="lead mb-0">{{ site.tagline }}</p>
                                {% endif %}
                            </div>

                            <div class="col-lg-5 mt-4 mt-lg-0">
                                <div class="gallery-preview">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <img src="{{ site.data.featured_item.src | relative_url }}" class="img-fluid">
                                        </div>
                                        <div class="col-6">
                                            <img src="{{ site.data.featured_item.src | relative_url }}" class="img-fluid">
                                        </div>
                                    </div>

                                    <div class="decade-chart-wrap mt-3 mb-0">
                                        <h2>Distribución</h2>
                                        <p class="mb-0 small text-muted">Explora las colecciones y materiales digitalizados del repositorio.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            {% include advanced-search.html %}
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
